name: Release

# Runs only after CI succeeded on a push to main, so nothing is versioned or
# published from a commit that failed typecheck, tests or the build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release-main

permissions: {}

jobs:
  release:
    # Skip runs overtaken by a newer commit on main: its own CI run releases it
    # (changesets/action resets the version branch to github.sha, the tip of main)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write       # version commits + tags
      pull-requests: write  # "Version packages" PR
      id-token: write       # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens/updates the "Version packages" PR.
      # After that PR is merged: builds and publishes every bumped package.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
