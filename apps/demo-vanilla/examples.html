<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Gantry examples gallery with the Web Component: every case live, with its code and the framework differences it runs into."
    />
    <title>Examples · Gantry Web Component</title>
  </head>
  <body>
    <!-- Static shell; src/gallery/main.ts fills the version, links and icons, and draws the page of
         the hash: no hash (or #/) is the gallery index, #/<id> a case -->
    <div class="gs-app">
      <a class="gs-skip" href="#main" id="skip">Skip to content</a>
      <header class="gs-header">
        <div class="gs-container gs-header-inner">
          <a class="gs-brand" href="./">
            <span class="gs-logo" aria-hidden="true"></span>
            <span>Gantry</span>
            <span class="gs-version" id="site-version"></span>
            <span class="gs-badge gl-badge">Web Component</span>
          </a>
          <nav class="gs-nav" aria-label="Primary">
            <ul class="gs-nav-list">
              <li>
                <a class="gs-nav-link" href="./"><svg data-icon="playground"></svg><span>Playground</span></a>
              </li>
              <li>
                <a class="gs-nav-link" href="#/" id="nav-examples" aria-current="page"
                  ><svg data-icon="examples"></svg><span>Examples</span></a
                >
              </li>
            </ul>
          </nav>
          <div class="gs-header-actions">
            <button type="button" class="gs-icon-btn" id="theme-toggle" aria-label="Dark theme" aria-pressed="false">
              <svg data-icon="moon"></svg>
            </button>
            <a class="gs-icon-btn" id="site-repo" aria-label="Source code on GitHub"><svg data-icon="github"></svg></a>
          </div>
        </div>
      </header>

      <main id="main" class="gs-main" tabindex="-1">
        <div class="gs-container" id="page"></div>
      </main>

      <footer class="gs-footer">
        <div class="gs-container">
          <p id="footer-meta"></p>
          <p id="footer-tagline"></p>
        </div>
      </footer>
    </div>
    <div class="gs-sr-only" role="status" id="status"></div>
    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
